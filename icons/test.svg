<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neon-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>

  <!-- Glowing Grid lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="4"/>

  <!-- RC Car Silhouette -->
  <!-- Wheels -->
  <rect x="120" y="130" width="48" height="80" rx="12" fill="#334155" stroke="#06b6d4" stroke-width="4"/>
  <rect x="344" y="130" width="48" height="80" rx="12" fill="#334155" stroke="#06b6d4" stroke-width="4"/>
  <rect x="120" y="302" width="48" height="80" rx="12" fill="#334155" stroke="#06b6d4" stroke-width="4"/>
  <rect x="344" y="302" width="48" height="80" rx="12" fill="#334155" stroke="#06b6d4" stroke-width="4"/>

  <!-- Car Chassis -->
  <path d="M 180 140 C 180 100, 332 100, 332 140 L 340 360 C 340 395, 172 395, 172 360 Z" 
        fill="url(#cyan-glow)" filter="url(#glow)"/>

  <!-- Cockpit & Accents -->
  <path d="M 206 180 C 206 150, 306 150, 306 180 L 316 280 C 316 310, 196 310, 196 280 Z" 
        fill="#090d16" stroke="#38bdf8" stroke-width="4"/>

  <!-- Bluetooth Icon -->
  <g transform="translate(256, 235) scale(1.4)" filter="url(#glow)">
    <path d="M -8 -16 L 8 0 L -8 16 V -16 L 8 -4 L -4 6 M -8 6 L 8 -6" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Front Headlight Beams -->
  <polygon points="190,110 140,50 220,50" fill="#facc15" opacity="0.4"/>
  <polygon points="322,110 292,50 372,50" fill="#facc15" opacity="0.4"/>
</svg>
